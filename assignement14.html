<!DOCTYPE html>
<html>
<head>
    <title>Nested Table</title>
</head>
<body>

<table border="1" cellpadding="10">
    <tr>
        <th>Name</th>
        <th>Details</th>
    </tr>
    <tr>
        <td>VISHANT PAL</td>
        <td>
            <table border="1" cellpadding="5">
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                        </tr>
                <tr>
                    <td>Math</td>
                    <td>90</td>
                </tr>
                <tr>
                    <td>Science</td>
                    <td>85</td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
</head>
<body>

    <h2>Student Marks Table</h2>

    <table border="1" cellpadding="10">

        <!-- Table Caption -->
        <caption>Student Examination Result</caption>

        <!-- Table Header --
           <thead>
            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
        </thead>

        <!-- Table Body -->
        <tbody>
            <tr>
                <td>101</td>
                <td>Rahul</td>
                <td>HTML</td>
                <td>85</td>
            </tr>
              <tr>
                <td>102</td>
                <td>Amit</td>
                <td>CSS</td>
                <td>90</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Priya</td>
                <td>JavaScript</td>
                <td>95</td>
            </tr>
        </tbody>

        <!-- Table Footer -->
        <tfoot>
            <tr>
                 <th colspan="3">Total Marks</th>
                <th>270</th>
            </tr>
        </tfoot>

    </table>

</body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <title>Unordered list,Ordered list,Description list</title>
  </head>
  <body>
      <h1>Unordered list</h1>
      <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVA script</li>
      </ul>

      <h1>Odered list</h1>
      <ol>
        <li>Install VS Code</li>
        <li>Create file</li>
        <li>Open in browser</li>
      </ol>

      <h1>Description list</h1>
      <dl>
        <dt>HTML</dt>
        <dd>Hyper Text Marekup Language</dd>

        <dt>CSS</dt>
        <dd>Cascading Style Sheet</dd>
      </dl>
  </body>
</html>

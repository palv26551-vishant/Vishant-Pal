<!DOCTYPE html>
<html>
<head>
    <title>Multimedia in HTML</title>
</head>
<body>

    <h1>Multimedia Elements in HTML</h1>

    <!-- 1. Image -->
    <h2>1. Image</h2>
    <img src="image.jpg"
         alt="Beautiful Nature"
         width="300"
         height="200">

    <!-- 2. Video -->
    <h2>2. Video</h2>
    <video width="400" height="250" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

    <!-- 3. Audio -->
    <h2>3. Audio</h2>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <!-- 4. YouTube Video -->
    <h2>4. YouTube Video</h2>
    <iframe
        width="400"
        height="250"
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="YouTube Video"
        allowfullscreen>
    </iframe>
</body>
</html>

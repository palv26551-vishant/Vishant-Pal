<!DOCTYPE html>
<html>
<head>
    <title>Class Timetable</title>
</head>
<body>

    <h2 align="center">Class Timetable</h2>

    <table border="1" cellpadding="10" cellspacing="0"
           align="center">

        <caption>Weekly Class Schedule</caption>

        <tr>
            <th>Day / Time</th>
            <th>9:00-10:00</th>
            <th>10:00-11:00</th>
            <th>11:00-12:00</th>
            <th>12:00-1:00</th>
        </tr>

        <tr>
            <th>Monday</th>
            <td>HTML</td>
            <td>CSS</td>
            <td rowspan="5">Lunch Break</td>
            <td>JavaScript</td>
        </tr>

        <tr>
            <th>Tuesday</th>
            <td>English</td>
            <td>Maths</td>
            <td>Computer</td>
        </tr>

        <tr>
            <th>Wednesday</th>
            <td>Science</td>
            <td>HTML</td>
            <td>CSS</td>
        </tr>

        <tr>
            <th>Thursday</th>
            <td>Maths</td>
            <td>English</td>
            <td>JavaScript</td>
        </tr>

        <tr>
            <th>Friday</th>
            <td colspan="2">Computer Lab</td>
            <td>Sports</td>
        </tr>

    </table>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Semantic Elements</title>
</head>
<body>

    <h1>Semantic Layout</h1>

    <header>
        <h2>My Website</h2>
    </header>

    <nav>
        Home | About | Contact
    </nav>

    <main>
        <section>
            <h2>About Us</h2>
            <p>Welcome to my website.</p>
        </section>

        <article>
            <h2>My First Article</h2>
            <p>This is an article.</p>
        </article>
    </main>

    <footer>
        Copyright 2026
    </footer>

    <h1>Non-Semantic Layout</h1>

    <div>
        <h2>My Website</h2>
    </div>

    <div>
        Home | About | Contact
    </div>

    <div>
        <h2>About Us</h2>
        <p>Welcome to my website.</p>
    </div>

    <div>
        <h2>My First Article</h2>
        <p>This is an article.</p>
    </div>

    <div>
        Copyright 2026
    </div>

</body>
</html>

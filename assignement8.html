<!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks and Images</title>
</head>
<body>

    <h2>Hyperlinks and Images</h2>

    <!-- External Link -->
    <h3>1. External Link</h3>
    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>

    <!-- Internal Link -->
    <h3>2. Internal Link</h3>
    <a href="#about">Go to About Section</a>

    <h3 id="about">About Section</h3>
    <p>Welcome to my HTML webpage.</p>

    <!-- Email Link -->
    <h3>3. Email Link</h3>
    <a href="mailto:example@gmail.com">
        Send Email
    </a>

    <!-- Image Link -->
    <h3>4. Image Link</h3>
    <a href="https://www.google.com" target="_blank">
        <img src="image.jpg"
             alt="Sample Image"
             width="200"
             height="150">
    </a>

</body>
</html>


<!DOCTYPE html>
<html>
<head>
    <title>Select, Textarea and Buttons</title>
</head>
<body>

    <h2>Student Feedback Form</h2>

    <form>

        <label for="course">Select Your Course:</label>
        <select id="course" name="course">
            <option value="">--Select Course--</option>
            <option value="cse">B.Tech CSE</option>
            <option value="ece">B.Tech ECE</option>
            <option value="it">B.Tech IT</option>
        </select>

        <br><br>

        <label for="feedback">Enter Your Feedback:</label>
        <br>

        <textarea id="feedback" name="feedback"
                  rows="5" cols="35"
                  placeholder="Write your feedback here...">
        </textarea>

        <br><br>

        <button type="submit">Submit</button>

        <button type="reset">Reset</button>

        <button type="button"
                onclick="alert('Hello Student!')">
            Click Me
        </button>

    </form>

</body>
</html>
